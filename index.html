<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FED | Free Events Delhi</title>
<meta name="description" content="Free events in Delhi NCR: screenings, theatre, music, talks and more.">
<link rel="preload" as="fetch" href="events.json" crossorigin>
<style>
/* ---- Tokens ---- */
:root {
  color-scheme: light;
  --bg: #ebebeb;          /* page */
  --surface: #dadada;     /* card background */
  --ink: #16181d;
  --muted: #565e66;
  --line: #e1e4e7;
  --accent: #0f5c70;      /* "Recurring" tag and text links */
  --btn: #464e62;         /* Register button (dark grey) */
  --btn-ink: #ffffff;
  --focus: #1a5fd0;
  --thumb-bg: #e4e7ea;
}

/* ---- Base ---- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  /* System stack + Noto/Mangal/Naskh fallbacks so Devanagari and Urdu render properly */
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari",
               "Mangal", "Noto Naskh Arabic", "Noto Nastaliq Urdu", Arial, sans-serif;
  line-height: 1.55;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ---- Header ---- */
header { padding: 40px 0 56px; text-align: center; }

.logo { display: inline-block; --ls: .28em; }
.brand { margin: 0 calc(var(--ls) * -1) 0 0; font-size: 6rem; font-weight: 300; letter-spacing: var(--ls); line-height: 1.1; }
.tagline { margin: -10px 0 0; width: 100%; color: var(--muted); font-size: 1.1rem; letter-spacing: .2em; font-style: italic; text-align: justify; text-align-last: justify; }

/* ---- Search box: sits under the tagline, exactly as wide as the FED letters ---- */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
/* width:0 + min-width:100% stops the input's own size from stretching the logo; it just follows the FED width */
.search { position: relative; display: block; width: 0; min-width: 100%; margin-top: 22px; text-align: left; }
.search.pending { visibility: hidden; }            /* keeps its space until events load, so nothing jumps */
.search input {
  display: block; width: 100%; margin: 0; padding: 2px 30px 2px 10px;   /* thin box: height is just a little more than the text */
  font: inherit; font-size: 16px;                  /* 16px stops iPhones zooming in on focus */
  line-height: 1.25; color: var(--ink);
  background: #f4f4f4; border: 1px solid #b9bec3; border-radius: 2px;
  -webkit-appearance: none; appearance: none;
}
/* No blue focus ring on the box; the border simply turns darker while typing */
.search input:focus, .search input:focus-visible { outline: none; border-color: var(--muted); }
.search input::placeholder { color: var(--muted); opacity: 1; }
.search input::-webkit-search-cancel-button,
.search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
.search-clear {
  position: absolute; top: 0; right: 0; width: 30px; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; padding: 0; cursor: pointer;
  font-size: 1.2rem; line-height: 1; color: var(--muted);
}
.search-clear[hidden] { display: none; }
/* Magnifier shows while the box is empty; the x takes its place once something is typed. Same dim grey for both. */
.search { --search-ink: #b3b7bc; }
.search-clear { color: var(--search-ink); }
.search-icon { position: absolute; top: 50%; right: 8px; transform: translateY(-50%); color: var(--search-ink); pointer-events: none; }
.search.has-value .search-icon { display: none; }

/* ---- List and cards ---- */
#status { text-align: center; color: var(--muted); padding: 40px 0; margin: 0; }
#status button { margin-left: 8px; }
/* Loading text is kept for screen readers only; sighted users see the skeleton cards */
#status.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
#events { list-style: none; margin: 0; padding: 0; }
.card {
  display: grid;
  grid-template-columns: 30% minmax(0, 1fr);
  position: relative;
  margin-bottom: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 2px;
  overflow: hidden;
}
/* Paints the thumbnail column grey so there is no gap while the image fades in */
.card:not(.no-thumb) { background: linear-gradient(to right, var(--thumb-bg) 30%, var(--surface) 30%); }
.card:hover { border-color: var(--muted); }
.card.no-thumb { grid-template-columns: minmax(0, 1fr); }
.body { min-width: 0; padding: clamp(8px, 2.5vw, 16px) clamp(10px, 3vw, 20px); }
.thumb {
  width: 100%; height: 100%; aspect-ratio: 3 / 4;
  object-fit: cover; border-radius: 0; display: block;
  background: var(--thumb-bg);
  opacity: 0; transition: opacity .25s ease;   /* fades in once loaded */
}
.thumb.loaded { opacity: 1; }
.card h2 { margin: 0 0 4px; font-size: 1.1rem; line-height: 1.3; }
/* Title is a real button; its ::after stretches over the whole card so the card is clickable */
.open {
  all: unset; cursor: pointer; font-weight: 650;
}
.open::after { content: ""; position: absolute; inset: 0; border-radius: 8px; }
.open:focus-visible { outline: none; }
.open:focus-visible::after { outline: 3px solid var(--focus); outline-offset: 2px; }

.meta p { margin: 0; font-size: .95rem; color: var(--muted); }
.meta .when { color: var(--ink); font-weight: 500; }
.tag {
  display: inline-block; margin-left: 6px; padding: 0 8px; border: 1px solid var(--accent);
  border-radius: 99px; color: var(--accent); font-size: .78rem; font-weight: 600; vertical-align: 1px;
}
.desc {
  margin: 8px 0 0; font-size: .95rem;
  display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;}
.btn {
  position: relative; z-index: 2; /* sits above the stretched card button */
  display: inline-block; margin-top: 10px; padding: 1px 20px;
  background: var(--btn); color: var(--btn-ink);
  border: 0; border-radius: 2px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
}
.btn:hover { filter: brightness(1.1); }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }

.card h2 { font-size: clamp(.95rem, 3vw, 1.2rem); }
.card .meta p, .card .desc { font-size: clamp(.78rem, 2.4vw, .95rem); line-height: 1.4; }
.card .btn { margin-top: 6px; }
@media (max-width: 479px) { .card .desc { display: none; } }

/* ---- Skeleton cards (shown until events render) ---- */
.skel { animation: skel-pulse 1.4s ease-in-out infinite; }
.skel-thumb { height: 100%; aspect-ratio: 3 / 4; }
.skel-line { height: .9em; margin: 0 0 .7em; border-radius: 2px; background: var(--thumb-bg); }
.skel-line:nth-child(1) { width: 70%; height: 1.1em; }
.skel-line:nth-child(2) { width: 45%; }
.skel-line:nth-child(3) { width: 60%; }
.skel-line:nth-child(4) { width: 35%; }
@keyframes skel-pulse { 50% { opacity: .55; } }

/* ---- Zoom view (native dialog: Esc, focus trap and backdrop come built in) ---- */
dialog {
  width: min(960px, calc(100% - 24px)); max-height: calc(100dvh - 24px);
  padding: 0; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--ink); overflow: auto;
}
dialog::backdrop { background: rgba(0, 0, 0, .6); }
.bar { position: sticky; top: 0; z-index: 3; display: flex; justify-content: flex-end; padding: 10px 12px; background: var(--bg); }
.bar .btn { margin: 0; background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 6px 14px; }
.zoom { display: grid; gap: 20px; padding: 0 16px 20px; }
.poster { width: 100%; height: auto; display: block; border-radius: 4px; }
/* Tiny blur placeholder (poster_blur) stretched to the box, sharp poster fades in on top when loaded.
   The placeholder is a small copy of the same poster, so its natural proportions set the box shape. */
.poster-wrap { position: relative; overflow: hidden; border-radius: 4px; background: #16181d; }
.poster-wrap.empty { aspect-ratio: 3 / 4; }                      /* no poster_blur: plain dark box until the poster sizes it */
.poster.ph { filter: blur(10px); transform: scale(1.1); }
.poster-wrap.sized .poster.ph { position: absolute; inset: 0; height: 100%; }   /* box now has the poster's exact ratio */
.poster-wrap.failed .poster.ph { filter: none; transform: none; }
.poster.full { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .3s ease; }
.poster.full.show { opacity: 1; }
.poster.full.static { position: static; height: auto; }
.poster-note { margin: 8px 0 0; font-size: .85rem; color: var(--muted); }
.poster-wrap .poster-note { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; padding: 8px 10px; background: rgba(0, 0, 0, .65); color: #fff; }
.side h2 { margin: 0 0 6px; font-size: 1.3rem; line-height: 1.3; }
.side .desc { display: block; -webkit-line-clamp: unset; line-clamp: unset; overflow: visible; margin-top: 12px; }.details { margin: 12px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .95rem; }
@media (min-width: 760px) {
  .zoom { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; padding: 0 24px 24px; align-items: start; }
}

/* ---- Info box (notice and copyright): at the bottom on small screens, top right on wide screens ---- */
body { position: relative; }
footer { padding: 8px 0 32px; }
.info {
  background: #e1e1e1; padding: 16px 18px; border-radius: 2px;
  text-align: center; color: var(--muted); font-size: .7rem; line-height: 1.6;
}
.info p { margin: 0; }
.info p + p { margin-top: 12px; }
.info a { color: inherit; text-decoration: underline; }   /* same colour and font as the rest of the box */
@media (min-width: 1300px) {
  footer { padding: 0; }
  .info { position: absolute; top: 57px; right: 24px; width: min(320px, calc(50vw - 440px)); }   /* top = top edge of the FED letters; sits in the free space beside the 760px column */
}
/* ---- Event rail: fixed vertical grid, one row per day for the next 30 days, one cell per event ---- */
:root {
  --row: clamp(9px, calc((100dvh - 90px) / 36), 14px);   /* row height shrinks to fit short screens */
  --cell: calc(var(--row) - 4px);
  --cell-gap: 3px;
  --cell-bg: #a1c5ad;                                     /* cell colour */
}
.rail { position: fixed; top: 50%; transform: translateY(-50%); left: 16px; z-index: 5;
         /* width = free space between the viewport's left edge and the cards (cards start at (100vw - 760px) / 2 + 16px),
            minus the rail's own left offset and a gap. Cells wrap to fit, so smaller cells mean more per row. */
         width: calc((100vw - 760px) / 2 - 24px); }  /* vertically centred: shrinking rows adds equal space above and below */
.rail[hidden] { display: none; }
.rail-month {
  margin-top: 8px; height: var(--row); display: flex; align-items: center;
  font-size: calc(var(--row) * .62); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink);
}
.rail-month:first-child { margin-top: 0; }
.rail-row { display: flex; align-items: flex-start; gap: 6px; min-height: var(--row); }
.rail-day {
  flex: none; width: 18px; height: var(--row); display: flex; align-items: center; justify-content: flex-start;   /* left edge lines up with the month's first letter */
  font-size: calc(var(--row) * .6); color: var(--muted); font-variant-numeric: tabular-nums;
}
.rail-day.today { color: var(--ink); font-weight: 700; }
.rail-cells { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: var(--cell-gap); padding: 2px 0; }
.rail-cell {
  width: var(--cell); height: var(--cell); padding: 0; border: 0; border-radius: 2px;
  background: var(--cell-bg); cursor: pointer;
}
.rail-cell:hover { filter: brightness(1.25); }
.rail-cell[hidden] { display: none; }               /* cells of events filtered out by the search */
.card.flash { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 1000px) {
  .rail { display: none !important; }                     /* no rail on phones and small screens */
}
@media (min-width: 1001px) {
  :root { --cell-gap: 4px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; }
  .thumb, .poster.full { transition: none; }
  .skel { animation: none; }
}
</style>
</head>
<body>
<nav class="rail" id="rail" aria-label="Events in the next 30 days" hidden></nav>
<header>
  <div class="wrap">
    <div class="logo">
      <h1 class="brand">FED</h1>
      <p class="tagline">Free Events Delhi</p>
      <div class="search pending" id="search" role="search">
        <label for="q" class="sr-only">Search events</label>
        <input type="search" id="q" enterkeyhint="search" autocomplete="off"
               autocapitalize="off" autocorrect="off" spellcheck="false">
        <button type="button" class="search-clear" id="search-clear" aria-label="Clear search" hidden>&times;</button>
        <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15 15l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <p id="status" role="status" class="sr-only">Loading events…</p>
  <div id="skeleton" aria-hidden="true">
    <div class="card skel"><div class="skel-thumb"></div><div class="body"><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div></div></div>
    <div class="card skel"><div class="skel-thumb"></div><div class="body"><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div></div></div>
    <div class="card skel"><div class="skel-thumb"></div><div class="body"><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div></div></div>
  </div>
  <ul id="events"></ul>
</main>

<footer>
  <div class="wrap">
    <aside class="info">
      <p>Events are free. Details can change, so check with the organiser.</p>
      <p>
        <!-- Replace REPLACE_FEEDBACK_LINK below (a Google Form or a mailto: link both work) -->
        <a href="https://forms.gle/78FRMKMFPsaNT2Ry9" target="_blank" rel="noopener noreferrer">Feedback</a> &middot;
        <a href="https://chat.whatsapp.com/LikFIKWgCoILTAktiD6NGE" target="_blank" rel="noopener noreferrer">Join on WhatsApp</a>
      </p>
      <p>© 2026 FED. Made by Prabhat.</p>
    </aside>
  </div>
</footer>

<dialog id="zoom" aria-labelledby="zoom-title">
  <div class="bar"><button type="button" class="btn" id="close">Close</button></div>
  <div class="zoom" id="zoom-body"></div>
</dialog>

<script>
(function () {
  "use strict";

  var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var statusEl = document.getElementById("status");
  var skeleton = document.getElementById("skeleton");
  var listEl = document.getElementById("events");
  var dialog = document.getElementById("zoom");
  var zoomBody = document.getElementById("zoom-body");
  var railEl = document.getElementById("rail");
  var cardFor = new Map();                          // event object -> its <li>, used by the rail
  var RAIL_DAYS = 30;
  var searchEl = document.getElementById("search");
  var searchInput = document.getElementById("q");
  var searchClear = document.getElementById("search-clear");
  var searchText = new Map();                       // event object -> lowercase, accent-free text to search
  var railCells = new Map();                        // event object -> its rail buttons (one per day it runs)

  /* ---- Helpers ---- */

  // Today's date in IST as YYYY-MM-DD (en-CA formats that way)
  function todayIST() {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kolkata" }).format(new Date());
  }

  // Trimmed string or null (hides empty/null fields)
  function str(v) {
    return typeof v === "string" && v.trim() !== "" ? v.trim() : null;
  }

  // Build an element; all text goes in via textContent/text nodes, never as HTML
  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    [].concat(kids || []).forEach(function (kid) {
      if (kid != null) node.append(kid);
    });
    return node;
  }

  // Repo-relative path, encoded per segment (paths can contain spaces); no leading slash
  function assetUrl(p) {
    p = str(p);
    return p ? p.replace(/^\/+/, "").split("/").map(encodeURIComponent).join("/") : null;
  }

  // Only allow http(s) links; returns the link as written, or null
  function safeLink(v) {
    v = str(v);
    if (!v) return null;
    try {
      var u = new URL(v);
      return u.protocol === "http:" || u.protocol === "https:" ? v : null;
    } catch (e) { return null; }
  }

  // "2026-11-14" -> "Sat, 14 Nov" (year added only when it differs from the current year)
  function fmtDate(iso, showYear) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    if (!m) return null;
    var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    var out = DAYS[d.getUTCDay()] + ", " + (+m[3]) + " " + MONTHS[+m[2] - 1];
    return showYear ? out + " " + m[1] : out;
  }

  // "18:00" -> "6:00 PM"
  function fmtTime(t) {
    var m = /^(\d{1,2}):(\d{2})/.exec(t || "");
    if (!m) return null;
    var h = +m[1];
    return ((h % 12) || 12) + ":" + m[2] + " " + (h >= 12 ? "PM" : "AM");
  }

  function dateText(ev, thisYear) {
    var rec = str(ev.recurrence);
    if (ev.recurring === true && rec) return rec.charAt(0).toUpperCase() + rec.slice(1);
    var end = ev.end_date && ev.end_date !== ev.date ? ev.end_date : null;
    var showYear = [ev.date, end].some(function (d) { return d && d.slice(0, 4) !== thisYear; });
    var a = fmtDate(ev.date, showYear);
    var b = end ? fmtDate(end, showYear) : null;
    return a && b ? a + " – " + b : a;
  }

  function timeText(ev) {
    var s = fmtTime(ev.start_time), e = fmtTime(ev.end_time);
    if (s && e) return s + " – " + e;
    return s || (e ? "Until " + e : null);
  }

  // Date/time, venue and organiser lines shared by the card and the zoom view
  function metaBlock(ev, thisYear) {
    var box = el("div", { "class": "meta" });
    var when = [dateText(ev, thisYear), timeText(ev)].filter(Boolean).join(", ");
    if (when || ev.recurring === true) {
      var p = el("p", { "class": "when", dir: "auto" }, when);
      if (ev.recurring === true) p.append(el("span", { "class": "tag" }, "Recurring"));
      box.append(p);
    }
    if (str(ev.venue)) box.append(el("p", { dir: "auto" }, str(ev.venue)));
    if (str(ev.organiser)) box.append(el("p", { dir: "auto" }, "By " + str(ev.organiser)));
    return box;
  }

  // GoatCounter event: one row per event title, e.g. "register: Umang Utsav 2026".
  // Does nothing if the counter script has not loaded (ad blocker, slow network).
  function trackRegister(title) {
    try {
      if (window.goatcounter && typeof window.goatcounter.count === "function") {
        window.goatcounter.count({ path: "register: " + title, title: "Register click: " + title, event: true });
      }
    } catch (e) { /* analytics must never break the page */ }
  }

  function registerButton(ev) {
    var href = safeLink(ev.registration_link);
    if (!href) return null;
    var title = str(ev.title) || "Untitled event";
    var a = el("a", {
      "class": "btn", href: href, target: "_blank", rel: "noopener noreferrer",
      "aria-label": "Register for " + title + " (opens in a new tab)"
    }, "Register");
    a.addEventListener("click", function () { trackRegister(title); });
    return a;
  }

  /* ---- Poster preloading ---- */

  var preloaded = {};

  // Skip preloading on data saver or slow connections
  function canPreload() {
    var c = navigator.connection;
    return !(c && (c.saveData || /^(slow-2g|2g|3g)$/.test(c.effectiveType)));
  }

  // Fetch a poster into the browser cache; calls done() when finished (or failed)
  function preloadPoster(url, done) {
    if (!url || preloaded[url]) { if (done) done(); return; }
    var im = new Image();
    preloaded[url] = im;
    im.onload = function () { if (done) done(); };
    im.onerror = function () { delete preloaded[url]; if (done) done(); };
    im.src = url;
  }

  // Preload the first 6 posters one at a time, when the browser is idle
  function preloadFirst(urls) {
    if (!canPreload()) return;
    var queue = urls.slice(0, 6);
    function next() { var u = queue.shift(); if (u) preloadPoster(u, next); }
    var idle = window.requestIdleCallback || function (fn) { return setTimeout(fn, 1500); };
    idle(next);
  }

  /* ---- Cards ---- */

  function buildCard(ev, thisYear, index) {
    var title = str(ev.title) || "Untitled event";
    var thumb = assetUrl(ev.thumb) || assetUrl(ev.poster);
    var poster = assetUrl(ev.poster);

    var card = el("article", { "class": "card" + (thumb ? "" : " no-thumb") });

    if (thumb) {
      var attrs = { "class": "thumb", src: thumb, alt: "Poster for " + title,
                    width: "300", height: "400", decoding: "async" };   // size hint; CSS sets the real size
      if (index >= 4) attrs.loading = "lazy";          // first 4 load immediately
      if (index === 0) attrs.fetchpriority = "high";   // first image gets top priority
      var img = el("img", attrs);
      img.addEventListener("load", function () { img.classList.add("loaded"); });
      // If the thumbnail is missing, fall back to the full poster once
      img.addEventListener("error", function () {
        if (poster && !img.dataset.fb && img.getAttribute("src") !== poster) {
          img.dataset.fb = "1";
          img.src = poster;
        }
      });
      if (img.complete && img.naturalWidth) img.classList.add("loaded");
      card.append(img);
    }

    var body = el("div", { "class": "body" });
    var btn = el("button", { type: "button", "class": "open", dir: "auto" }, title);
    btn.addEventListener("click", function () { openZoom(ev, thisYear); });
    body.append(el("h2", {}, btn), metaBlock(ev, thisYear));
    if (str(ev.description)) body.append(el("p", { "class": "desc", dir: "auto" }, str(ev.description)));
    var reg = registerButton(ev);
    if (reg) body.append(reg);
    card.append(body);

    // Start fetching the full poster as soon as someone points at or touches the card
    function warm() { if (canPreload()) preloadPoster(assetUrl(ev.poster) || assetUrl(ev.thumb)); }
    card.addEventListener("pointerenter", warm);
    card.addEventListener("touchstart", warm, { passive: true });

    return el("li", {}, card);
  }

  /* ---- Zoom view ---- */

  // Only a clean base64 string goes into a data: URL
  function blurSrc(v) {
    v = str(v);
    return v && /^[A-Za-z0-9+\/=]+$/.test(v) ? "data:image/jpeg;base64," + v : null;
  }

  // Zoom poster: the tiny poster_blur (stretched, same proportions as the poster) first, then the sharp poster
  // fades in. A poster that is already loaded or cached is shown at once, with no placeholder and no fade.
  // The card thumbnail is not used here at all.
  function buildPoster(title, blur, posterSrc) {
    var alt = "Poster for " + title;
    var wrap = el("div", { "class": "poster-wrap" });
    var full = new Image();
    var settled = false;
    var ph = null;

    full.alt = alt;
    full.onload = function () {
      if (settled || !wrap.isConnected) return;     // already shown, or the zoom view was closed or reused
      settled = true;
      // Give the box the poster's exact shape (the blur copy is rounded to whole pixels), then fade in
      wrap.style.aspectRatio = full.naturalWidth + " / " + full.naturalHeight;
      wrap.classList.remove("empty");
      wrap.classList.add("sized");
      full.className = "poster full";
      wrap.append(full);
      function finish() {
        if (!wrap.isConnected) return;
        if (ph) ph.remove();
        full.classList.add("static");
        wrap.classList.remove("sized");
        wrap.style.aspectRatio = "";
      }
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        full.classList.add("show");
        finish();
      } else {
        requestAnimationFrame(function () { requestAnimationFrame(function () { full.classList.add("show"); }); });
        full.addEventListener("transitionend", finish, { once: true });
        setTimeout(finish, 450);                    // safety net if transitionend doesn't fire
      }
    };
    full.onerror = function () {
      if (settled || !wrap.isConnected) return;
      settled = true;
      wrap.classList.add("failed");                 // un-blur the placeholder
      wrap.append(el("p", { "class": "poster-note", role: "status" }, "Couldn't load full poster."));
    };
    full.src = posterSrc;

    // Already loaded or cached (idle preload, hover, touch, earlier visit): show it instantly
    if (full.complete && full.naturalWidth) {
      settled = true;
      full.className = "poster";
      wrap.append(full);
      return wrap;
    }

    var b = blurSrc(blur);
    if (b) {
      ph = el("img", { "class": "poster ph", src: b, alt: "", "aria-hidden": "true" });
      wrap.append(ph);
    } else {
      wrap.classList.add("empty");                  // no placeholder: plain dark box, the poster sizes it when loaded
    }
    return wrap;
  }

  function openZoom(ev, thisYear) {
    var title = str(ev.title) || "Untitled event";
    var posterSrc = assetUrl(ev.poster) || assetUrl(ev.thumb);
    zoomBody.replaceChildren();

    if (posterSrc) zoomBody.append(buildPoster(title, ev.poster_blur, posterSrc));

    var side = el("div", { "class": "side" });
    side.append(el("h2", { id: "zoom-title", dir: "auto" }, title), metaBlock(ev, thisYear));
    if (str(ev.description)) side.append(el("p", { "class": "desc", dir: "auto" }, str(ev.description)));
    if (str(ev.details)) side.append(el("p", { "class": "details", dir: "auto" }, ev.details.trim())); // line breaks kept via CSS
    var regZ = registerButton(ev);
    if (regZ) side.append(regZ);
    zoomBody.append(side);

    document.body.style.overflow = "hidden";
    dialog.showModal();
    dialog.scrollTop = 0;
  }

  document.getElementById("close").addEventListener("click", function () { dialog.close(); });
  // Clicks on the backdrop land on the dialog element itself (its content fills the rest)
  dialog.addEventListener("click", function (e) { if (e.target === dialog) dialog.close(); });
  dialog.addEventListener("close", function () { document.body.style.overflow = ""; });

  /* ---- Event rail ---- */

  function addDays(iso, n) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + n)).toISOString().slice(0, 10);
  }

  function goToCard(ev) {
    var li = cardFor.get(ev);
    if (!li) return;
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    li.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
    var card = li.firstElementChild;
    card.classList.remove("flash");
    void card.offsetWidth;                          // restart the highlight if clicked twice
    card.classList.add("flash");
    setTimeout(function () { card.classList.remove("flash"); }, 1800);
  }

  // One row per day for the next 30 days (today first), one cell per event on that day.
  // A multi-day event gets a cell on every day it runs. Recurring events are left out.
  function buildRail(events, today) {
    railEl.replaceChildren();
    railEl.hidden = true;
    railCells.clear();
    var days = [], byDay = {}, total = 0;
    for (var i = 0; i < RAIL_DAYS; i++) { days.push(addDays(today, i)); byDay[days[i]] = []; }
    events.forEach(function (ev) {
      if (ev.recurring === true || !ev.date) return;
      var last = ev.end_date || ev.date;
      days.forEach(function (d) { if (ev.date <= d && d <= last) { byDay[d].push(ev); total++; } });
    });
    if (!total) return;

    var lastMonth = null;
    days.forEach(function (d, idx) {
      var mi = +d.slice(5, 7) - 1;
      if (mi !== lastMonth) {                       // month split with short month name
        railEl.append(el("div", { "class": "rail-month" }, MONTHS[mi]));
        lastMonth = mi;
      }
      var cells = el("div", { "class": "rail-cells" });
      byDay[d].forEach(function (ev) {
        var title = str(ev.title) || "Untitled event";
        var b = el("button", { type: "button", "class": "rail-cell", title: title,
                               "aria-label": title + ", " + fmtDate(d, false) });
        b.addEventListener("click", function () { goToCard(ev); });
        var mine = railCells.get(ev);
        if (!mine) railCells.set(ev, mine = []);
        mine.push(b);
        cells.append(b);
      });
      railEl.append(el("div", { "class": "rail-row" }, [
        el("span", { "class": "rail-day" + (idx === 0 ? " today" : "") }, String(+d.slice(8, 10))),
        cells
      ]));
    });
    railEl.hidden = false;
  }

  /* ---- Search ---- */

  // Lowercase and strip accents so "francaise" finds "Française". Devanagari and Urdu are left as they are.
  function norm(s) {
    return String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  // Title, venue, description and organiser, joined into one searchable string
  function haystack(ev) {
    return norm([ev.title, ev.venue, ev.description, ev.organiser].map(str).filter(Boolean).join(" "));
  }

  // Every typed word must appear somewhere in the event's text. No match = the cards simply disappear.
  function applySearch() {
    var terms = norm(searchInput.value).split(/\s+/).filter(Boolean);
    searchClear.hidden = !searchInput.value;
    searchEl.classList.toggle("has-value", !!searchInput.value);
    cardFor.forEach(function (li, ev) {
      var hay = searchText.get(ev) || "";
      var ok = terms.every(function (t) { return hay.indexOf(t) !== -1; });
      li.hidden = !ok;
      (railCells.get(ev) || []).forEach(function (b) { b.hidden = !ok; });
    });
  }

  // Keep the search in the address bar (?q=...) so a filtered view can be shared
  var urlTimer = null;
  function syncUrl() {
    try {
      var u = new URL(location.href);
      var q = searchInput.value.trim();
      if (q) u.searchParams.set("q", q); else u.searchParams.delete("q");
      history.replaceState(null, "", u);
    } catch (e) { /* the address bar is a nicety, never a requirement */ }
  }

  searchInput.addEventListener("input", function () {
    applySearch();
    clearTimeout(urlTimer);
    urlTimer = setTimeout(syncUrl, 400);             // wait for typing to pause (browsers limit history updates)
  });
  searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") searchInput.blur();       // closes the phone keyboard
    else if (e.key === "Escape" && searchInput.value) { e.preventDefault(); clearSearch(false); }
  });
  searchClear.addEventListener("click", function () { clearSearch(true); });

  function clearSearch(refocus) {
    searchInput.value = "";
    applySearch();
    syncUrl();
    if (refocus) searchInput.focus();
  }

  try { searchInput.value = new URLSearchParams(location.search).get("q") || ""; } catch (e) { /* ignore */ }
  searchClear.hidden = !searchInput.value;
  searchEl.classList.toggle("has-value", !!searchInput.value);

  /* ---- Load and render ---- */

  function showLoading() {
    skeleton.hidden = false;
    statusEl.className = "sr-only";                 // announced to screen readers only
    statusEl.hidden = false;
    statusEl.textContent = "Loading events…";
  }

  function showStatus(text, retry) {                // empty list or error
    skeleton.hidden = true;
    statusEl.className = "";
    statusEl.hidden = false;
    statusEl.replaceChildren(text);
    if (retry) {
      var b = el("button", { type: "button", "class": "linkbtn" }, "Try again");
      b.addEventListener("click", load);
      statusEl.append(b);
    }
  }

  function load() {
    showLoading();
    listEl.replaceChildren();
    cardFor.clear();
    searchText.clear();
    searchEl.classList.add("pending");
    railEl.hidden = true;
    fetch("events.json", { cache: "no-cache" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        var all = Array.isArray(data) ? data : data && data.events;
        if (!Array.isArray(all)) throw new Error("Unexpected data");

        var today = todayIST();
        var thisYear = today.slice(0, 4);

        var events = all.filter(function (ev) {
          if (!ev || ev.status !== "published") return false;
          if (ev.recurring === true) return true;           // recurring events are never hidden
          var last = ev.end_date || ev.date;
          return !(last && last < today);                    // hide past events (IST)
        });

        // Non-recurring events first, then all recurring events in a group at the end.
        // Within each group: date (for recurring, the date it started), start time, title.
        events.sort(function (a, b) {
          return (a.recurring === true) - (b.recurring === true) ||
                 (a.date || "9999-12-31").localeCompare(b.date || "9999-12-31") ||
                 (a.start_time || "").localeCompare(b.start_time || "") ||
                 (a.title || "").localeCompare(b.title || "");
        });

        if (!events.length) {
          showStatus("No upcoming events right now. Check back soon.");
          return;
        }
        statusEl.hidden = true;
        skeleton.hidden = true;
        events.forEach(function (ev, i) {
          var li = buildCard(ev, thisYear, i);
          cardFor.set(ev, li);
          searchText.set(ev, haystack(ev));
          listEl.append(li);
        });
        buildRail(events, today);
        searchEl.classList.remove("pending");
        applySearch();                                // applies a search typed early or taken from ?q=
        preloadFirst(events.map(function (ev) { return assetUrl(ev.poster) || assetUrl(ev.thumb); }));
      })
      .catch(function () {
        showStatus("Couldn't load events right now.", true);
      });
  }

  /* ---- Align the top of the info box with the top of the FED letters (any font, any device) ---- */
  // The gap between the h1's top edge and the top of its capital letters depends on the font, so it is measured
  // with canvas text metrics and written to the box as an inline `top`. The CSS value is the fallback.
  // (`top` only has an effect when the box is absolutely positioned, i.e. on wide screens.)
  var INFO_NUDGE = 0;   // manual fine-tune in pixels: positive moves the box down, negative moves it up
  var infoBox = document.querySelector(".info");
  var brandEl = document.querySelector(".brand");
  function alignInfo() {
    try {
      var cs = getComputedStyle(brandEl);
      var ctx = document.createElement("canvas").getContext("2d");
      ctx.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      var m = ctx.measureText("FED");
      var lineH = parseFloat(cs.lineHeight);
      if (!(m.fontBoundingBoxAscent > 0) || !(m.actualBoundingBoxAscent > 0) || !(lineH > 0)) return;   // old browser: keep CSS value
      var baseline = (lineH - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2 + m.fontBoundingBoxAscent;
      var top = brandEl.getBoundingClientRect().top + window.pageYOffset + baseline - m.actualBoundingBoxAscent;
      infoBox.style.top = Math.round(top + INFO_NUDGE) + "px";
    } catch (e) { /* keep the CSS value */ }
  }
  alignInfo();
  window.addEventListener("resize", alignInfo);
  window.addEventListener("load", alignInfo);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignInfo);

  load();
})();
</script>
