<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FED | Free Events Delhi</title>
<meta name="description" content="Free events in Delhi NCR: screenings, theatre, music, talks and more.">
<style>
/* ---- Tokens ---- */
:root {
  color-scheme: light;
  --bg: #ebebeb;          /* page */
  --surface: #dadada;     /* card background */
  --ink: #16181d;
  --muted: #565e66;
  --line: #e1e4e7;
  --accent: #0f5c70;      /* "Recurring" tag and text links */
  --btn: #464e62;         /* Register button (dark grey) */
  --btn-ink: #ffffff;
  --focus: #1a5fd0;
  --thumb-bg: #e4e7ea;
}

/* ---- Base ---- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  /* System stack + Noto/Mangal/Naskh fallbacks so Devanagari and Urdu render properly */
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari",
               "Mangal", "Noto Naskh Arabic", "Noto Nastaliq Urdu", Arial, sans-serif;
  line-height: 1.55;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ---- Header ---- */
header { padding: 40px 0 28px; text-align: center; }
.brand { margin: 0; font-size: 2.6rem; font-weight: 800; letter-spacing: .28em; padding-left: .28em; line-height: 1.1; }
.tagline { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }

/* ---- List and cards ---- */
#status { text-align: center; color: var(--muted); padding: 40px 0; margin: 0; }
#status button { margin-left: 8px; }
#events { list-style: none; margin: 0; padding: 0; }
.card {
  display: grid;
  grid-template-columns: 30% minmax(0, 1fr);
  position: relative;
  margin-bottom: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.card:hover { border-color: var(--muted); }
.card.no-thumb { grid-template-columns: minmax(0, 1fr); }
.body { min-width: 0; padding: clamp(8px, 2.5vw, 16px) clamp(10px, 3vw, 20px); }
.thumb {
  width: 100%; height: 100%; aspect-ratio: 3 / 4;
  object-fit: cover; border-radius: 0; display: block;
  background: var(--thumb-bg);
}
.card h2 { margin: 0 0 4px; font-size: 1.1rem; line-height: 1.3; }
/* Title is a real button; its ::after stretches over the whole card so the card is clickable */
.open {
  all: unset; cursor: pointer; font-weight: 650;
}
.open::after { content: ""; position: absolute; inset: 0; border-radius: 8px; }
.open:focus-visible { outline: none; }
.open:focus-visible::after { outline: 3px solid var(--focus); outline-offset: 2px; }

.meta p { margin: 0; font-size: .95rem; color: var(--muted); }
.meta .when { color: var(--ink); font-weight: 500; }
.tag {
  display: inline-block; margin-left: 6px; padding: 0 8px; border: 1px solid var(--accent);
  border-radius: 99px; color: var(--accent); font-size: .78rem; font-weight: 600; vertical-align: 1px;
}
.desc {
  margin: 8px 0 0; font-size: .95rem;
  display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;}
.btn {
  position: relative; z-index: 2; /* sits above the stretched card button */
  display: inline-block; margin-top: 10px; padding: 1px 20px;
  background: var(--btn); color: var(--btn-ink);
  border: 0; border-radius: 2px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
}
.btn:hover { filter: brightness(1.1); }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }

.card h2 { font-size: clamp(.95rem, 3vw, 1.2rem); }
.card .meta p, .card .desc { font-size: clamp(.78rem, 2.4vw, .95rem); line-height: 1.4; }
.card .btn { margin-top: 6px; }
@media (max-width: 479px) { .card .desc { display: none; } }

/* ---- Zoom view (native dialog: Esc, focus trap and backdrop come built in) ---- */
dialog {
  width: min(960px, calc(100% - 24px)); max-height: calc(100dvh - 24px);
  padding: 0; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--ink); overflow: auto;
}
dialog::backdrop { background: rgba(0, 0, 0, .6); }
.bar { position: sticky; top: 0; z-index: 3; display: flex; justify-content: flex-end; padding: 10px 12px; background: var(--bg); }
.bar .btn { margin: 0; background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 6px 14px; }
.zoom { display: grid; gap: 20px; padding: 0 16px 20px; }
.poster { width: 100%; height: auto; display: block; border-radius: 4px; }
.side h2 { margin: 0 0 6px; font-size: 1.3rem; line-height: 1.3; }
.side .desc { display: block; -webkit-line-clamp: unset; line-clamp: unset; overflow: visible; margin-top: 12px; }.details { margin: 12px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .95rem; }
@media (min-width: 760px) {
  .zoom { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; padding: 0 24px 24px; align-items: start; }
}

footer { padding: 24px 0 48px; text-align: center; color: var(--muted); font-size: .85rem; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 class="brand">FED</h1>
    <p class="tagline">Free Events Delhi</p>
  </div>
</header>

<main class="wrap">
  <p id="status" role="status">Loading events…</p>
  <ul id="events"></ul>
</main>

<footer>
  <div class="wrap">Every event listed here is free. Details can change, so check with the organiser.</div>
</footer>

<dialog id="zoom" aria-labelledby="zoom-title">
  <div class="bar"><button type="button" class="btn" id="close">Close</button></div>
  <div class="zoom" id="zoom-body"></div>
</dialog>

<script>
(function () {
  "use strict";

  var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var statusEl = document.getElementById("status");
  var listEl = document.getElementById("events");
  var dialog = document.getElementById("zoom");
  var zoomBody = document.getElementById("zoom-body");

  /* ---- Helpers ---- */

  // Today's date in IST as YYYY-MM-DD (en-CA formats that way)
  function todayIST() {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kolkata" }).format(new Date());
  }

  // Trimmed string or null (hides empty/null fields)
  function str(v) {
    return typeof v === "string" && v.trim() !== "" ? v.trim() : null;
  }

  // Build an element; all text goes in via textContent/text nodes, never as HTML
  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    [].concat(kids || []).forEach(function (kid) {
      if (kid != null) node.append(kid);
    });
    return node;
  }

  // Repo-relative path, encoded per segment (paths can contain spaces); no leading slash
  function assetUrl(p) {
    p = str(p);
    return p ? p.replace(/^\/+/, "").split("/").map(encodeURIComponent).join("/") : null;
  }

  // Only allow http(s) links; returns the link as written, or null
  function safeLink(v) {
    v = str(v);
    if (!v) return null;
    try {
      var u = new URL(v);
      return u.protocol === "http:" || u.protocol === "https:" ? v : null;
    } catch (e) { return null; }
  }

  // "2026-11-14" -> "Sat, 14 Nov" (year added only when it differs from the current year)
  function fmtDate(iso, showYear) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    if (!m) return null;
    var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    var out = DAYS[d.getUTCDay()] + ", " + (+m[3]) + " " + MONTHS[+m[2] - 1];
    return showYear ? out + " " + m[1] : out;
  }

  // "18:00" -> "6:00 PM"
  function fmtTime(t) {
    var m = /^(\d{1,2}):(\d{2})/.exec(t || "");
    if (!m) return null;
    var h = +m[1];
    return ((h % 12) || 12) + ":" + m[2] + " " + (h >= 12 ? "PM" : "AM");
  }

  function dateText(ev, thisYear) {
    var rec = str(ev.recurrence);
    if (ev.recurring === true && rec) return rec.charAt(0).toUpperCase() + rec.slice(1);
    var end = ev.end_date && ev.end_date !== ev.date ? ev.end_date : null;
    var showYear = [ev.date, end].some(function (d) { return d && d.slice(0, 4) !== thisYear; });
    var a = fmtDate(ev.date, showYear);
    var b = end ? fmtDate(end, showYear) : null;
    return a && b ? a + " – " + b : a;
  }

  function timeText(ev) {
    var s = fmtTime(ev.start_time), e = fmtTime(ev.end_time);
    if (s && e) return s + " – " + e;
    return s || (e ? "Until " + e : null);
  }

  // Date/time, venue and organiser lines shared by the card and the zoom view
  function metaBlock(ev, thisYear) {
    var box = el("div", { "class": "meta" });
    var when = [dateText(ev, thisYear), timeText(ev)].filter(Boolean).join(", ");
    if (when || ev.recurring === true) {
      var p = el("p", { "class": "when", dir: "auto" }, when);
      if (ev.recurring === true) p.append(el("span", { "class": "tag" }, "Recurring"));
      box.append(p);
    }
    if (str(ev.venue)) box.append(el("p", { dir: "auto" }, str(ev.venue)));
    if (str(ev.organiser)) box.append(el("p", { dir: "auto" }, "By " + str(ev.organiser)));
    return box;
  }

  function registerButton(ev) {
    var href = safeLink(ev.registration_link);
    if (!href) return null;
    return el("a", {
      "class": "btn", href: href, target: "_blank", rel: "noopener noreferrer",
      "aria-label": "Register for " + (str(ev.title) || "this event") + " (opens in a new tab)"
    }, "Register");
  }

  /* ---- Cards ---- */

  function buildCard(ev, thisYear) {
    var title = str(ev.title) || "Untitled event";
    var thumb = assetUrl(ev.thumb) || assetUrl(ev.poster);
    var poster = assetUrl(ev.poster);

    var card = el("article", { "class": "card" + (thumb ? "" : " no-thumb") });

    if (thumb) {
      var img = el("img", { "class": "thumb", src: thumb, alt: "Poster for " + title, loading: "lazy", decoding: "async" });
      // If the thumbnail is missing, fall back to the full poster once
      img.addEventListener("error", function () {
        if (poster && !img.dataset.fb && img.getAttribute("src") !== poster) {
          img.dataset.fb = "1";
          img.src = poster;
        }
      });
      card.append(img);
    }

    var body = el("div", { "class": "body" });
    var btn = el("button", { type: "button", "class": "open", dir: "auto" }, title);
    btn.addEventListener("click", function () { openZoom(ev, thisYear); });
    body.append(el("h2", {}, btn), metaBlock(ev, thisYear));
    if (str(ev.description)) body.append(el("p", { "class": "desc", dir: "auto" }, str(ev.description)));
    var reg = registerButton(ev);
    if (reg) body.append(reg);
    card.append(body);
    return el("li", {}, card);
  }

  /* ---- Zoom view ---- */

  function openZoom(ev, thisYear) {
    var title = str(ev.title) || "Untitled event";
    var poster = assetUrl(ev.poster) || assetUrl(ev.thumb);
    zoomBody.replaceChildren();

    if (poster) zoomBody.append(el("img", { "class": "poster", src: poster, alt: "Poster for " + title }));

    var side = el("div", { "class": "side" });
    side.append(el("h2", { id: "zoom-title", dir: "auto" }, title), metaBlock(ev, thisYear));
    if (str(ev.description)) side.append(el("p", { "class": "desc", dir: "auto" }, str(ev.description)));
    if (str(ev.details)) side.append(el("p", { "class": "details", dir: "auto" }, ev.details.trim())); // line breaks kept via CSS
    var regZ = registerButton(ev);
    if (regZ) side.append(regZ);
    zoomBody.append(side);

    document.body.style.overflow = "hidden";
    dialog.showModal();
    dialog.scrollTop = 0;
  }

  document.getElementById("close").addEventListener("click", function () { dialog.close(); });
  // Clicks on the backdrop land on the dialog element itself (its content fills the rest)
  dialog.addEventListener("click", function (e) { if (e.target === dialog) dialog.close(); });
  dialog.addEventListener("close", function () { document.body.style.overflow = ""; });

  /* ---- Load and render ---- */

  function showStatus(text, retry) {
    statusEl.hidden = false;
    statusEl.replaceChildren(text);
    if (retry) {
      var b = el("button", { type: "button", "class": "linkbtn" }, "Try again");
      b.addEventListener("click", load);
      statusEl.append(b);
    }
  }

  function load() {
    showStatus("Loading events…");
    listEl.replaceChildren();
    fetch("events.json", { cache: "no-cache" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        var all = Array.isArray(data) ? data : data && data.events;
        if (!Array.isArray(all)) throw new Error("Unexpected data");

        var today = todayIST();
        var thisYear = today.slice(0, 4);

        var events = all.filter(function (ev) {
          if (!ev || ev.status !== "published") return false;
          if (ev.recurring === true) return true;           // recurring events are never hidden
          var last = ev.end_date || ev.date;
          return !(last && last < today);                    // hide past events (IST)
        });

        // Recurring events sort as if they happen today
        function key(ev) { return ev.recurring === true ? today : (ev.date || "9999-12-31"); }
        events.sort(function (a, b) {
          return key(a).localeCompare(key(b)) ||
                 (a.start_time || "").localeCompare(b.start_time || "") ||
                 (a.title || "").localeCompare(b.title || "");
        });

        if (!events.length) {
          showStatus("No upcoming events right now. Check back soon.");
          return;
        }
        statusEl.hidden = true;
        events.forEach(function (ev) { listEl.append(buildCard(ev, thisYear)); });
      })
      .catch(function () {
        showStatus("Couldn't load events right now.", true);
      });
  }

  load();
})();
</script>
</body>
</html>
